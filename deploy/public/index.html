<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quake III Arena — Web</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000;
    font-family: "SF Mono", Menlo, Consolas, monospace; color:#ddd; }
  canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:none; }
  .panel { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; background:#000; z-index:5; }
  .panel h1 { font-size:26px; font-weight:700; letter-spacing:2px; color:#d94a36; margin:0;
    text-transform:uppercase; }
  #login .field { display:flex; gap:8px; }
  #login input { background:#141414; border:1px solid #444; color:#eee; font:inherit;
    padding:10px 14px; width:min(260px, 60vw); border-radius:3px; outline-color:#d94a36; }
  #login select { background:#141414; border:1px solid #444; color:#eee; font:inherit;
    padding:10px 12px; min-width:0; flex:1; border-radius:3px; }
  #login select:disabled { opacity:.5; }
  #login .previewRow { display:flex; align-items:center; gap:10px; margin-top:10px; }
  #modelPreview { width:64px; height:64px; flex:0 0 64px; image-rendering:pixelated;
    background:#0d0d0d; border:1px solid #333; border-radius:3px; display:none; }
  #modelPreview.has { display:block; }
  #login button { background:#d94a36; border:0; color:#fff; font:inherit; padding:10px 22px;
    cursor:pointer; border-radius:3px; text-transform:uppercase; letter-spacing:1px; }
  #login button:disabled { background:#552; color:#996; cursor:default; }
  #login .hint { font-size:11px; color:#666; }
  #login a { color:#878; }
  #bar { width:min(420px, 70vw); height:8px; background:#222; border:1px solid #333; display:none; }
  #bar i { display:block; height:100%; width:0%; background:#d94a36; transition:width .15s; }
  #status { font-size:12px; color:#999; min-height:18px; }
  #log { position:absolute; left:8px; bottom:8px; right:8px; max-height:40vh; overflow:auto;
    font-size:11px; line-height:1.5; color:#7c6; background:rgba(0,0,0,.82); border:1px solid #244;
    padding:8px 10px; z-index:9; white-space:pre-wrap; display:none; }
  #log.show { display:block; }
  #playbar { position:absolute; right:8px; bottom:8px; display:none; gap:6px; z-index:10; }
  #playbar.show { display:flex; }
  #playbar button { background:rgba(20,20,20,.85); border:1px solid #444; color:#bbb;
    font:inherit; font-size:11px; padding:5px 10px; border-radius:3px; cursor:pointer; }
  #playbar button:hover { border-color:#d94a36; color:#fff; }
  #error { color:#d94a36; font-size:12px; white-space:pre-wrap; max-width:80vw; text-align:center; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="panel" id="login">
  <h1>Quake III Arena</h1>
  <div class="field">
    <input id="name" maxlength="16" placeholder="Player name" autocomplete="off" spellcheck="false">
    <button id="playBtn">Play</button>
  </div>
  <div class="previewRow">
    <canvas id="modelPreview" width="64" height="64" title="character preview"></canvas>
    <select id="model" title="Character"></select>
  </div>
  <div class="hint">name is remembered · pk3 downloads are cached <a id="clearCache" href="#">(clear)</a> · <a href="admin.html">server admin</a></div>
</div>
<div class="panel" id="bootNew" style="display:none">
  <div id="bar"><i></i></div>
  <div id="status">loading…</div>
  <div id="error"></div>
</div>
<div id="log"></div>
<div id="playbar">
  <button id="fsBtn" title="Fullscreen requires a click; press ESC to free the mouse first if the game has it">fullscreen</button>
  <button id="logBtn" title="F1 also toggles">logs (F1)</button>
</div>

<script>
// Surface module script failures on screen instead of silently dead buttons.
window.addEventListener('error', (e) => {
  const panel = document.getElementById('bootNew');
  const error = document.getElementById('error');
  if (panel && error) {
    document.getElementById('login').style.display = 'none';
    panel.style.display = '';
    error.textContent = 'script error: ' + (e.message || e.type || 'unknown');
  }
});
</script>

<script type="module">
const params = new URLSearchParams(location.search);
const statusEl = document.getElementById('status');
const barEl = document.querySelector('#bar i');
const barBox = document.getElementById('bar');
const errorBox = document.getElementById('error');
const logBox = document.getElementById('log');
const nameInput = document.getElementById('name');
const playBtn = document.getElementById('playBtn');

// ---------------------------------------------------------------- console log
const logLines = [];
function logLine(line) {
  logLines.push(line);
  if (logLines.length > 400) logLines.splice(0, logLines.length - 400);
  logBox.textContent = logLines.join('\n');
  logBox.scrollTop = logBox.scrollHeight;
}
// ~ opens the ENGINE console (drawn inside the canvas). This browser-side log
// overlay toggles separately via the "logs" button or F1, which the engine
// ignores, so the two consoles stay independent.
window.addEventListener('keydown', (e) => {
  if (e.code === 'F1' && !e.repeat) {
    logBox.classList.toggle('show');
  }
}, true);

// --- in-game player toolbar ----------------------------------------------------
// Fullscreen lives here because browsers can exit fullscreen/pointer-lock on
// ESC or window changes, and only a click can bring fullscreen back. The bar
// hides while the game holds the pointer (no cursor to click with) and walks
// back the moment it is released.

const playbar = document.getElementById('playbar');
const fsBtn = document.getElementById('fsBtn');
const logBtn = document.getElementById('logBtn');
logBtn.addEventListener('click', () => logBox.classList.toggle('show'));

function fullscreenElementOk() {
  // requestFullscreen lives on the element; fullscreenElement lives on
  // `document` (not documentElement). Use webkitRequestFullscreen as fallback.
  const root = document.documentElement;
  return !!(root.requestFullscreen || root.webkitRequestFullscreen) ? root : null;
}

fsBtn.addEventListener('click', () => {
  const el = fullscreenElementOk();
  if (!el) { logLine('this browser does not support fullscreen'); return; }
  const active = document.fullscreenElement || document.webkitFullscreenElement;
  if (active) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else if (el.requestFullscreen) el.requestFullscreen();
  else el.webkitRequestFullscreen();
});

const syncFullscreenLabel = () => {
  const active = document.fullscreenElement || document.webkitFullscreenElement;
  fsBtn.textContent = active ? 'window' : 'fullscreen';
};
document.addEventListener('fullscreenchange', syncFullscreenLabel);
document.addEventListener('webkitfullscreenchange', syncFullscreenLabel);

// Hide the toolbar while the engine owns the mouse; ESC (which the browser
// must swallow to leave pointer lock) brings it back together with the cursor.
document.addEventListener('pointerlockchange', () => {
  playbar.classList.toggle('show', document.pointerLockElement == null);
});

const realError = console.error;
console.error = (...a) => { realError(...a); logLine(a.map(String).join(' ')); };
logBox.classList.add('show');
logLine('[keys] ESC = game menu (quit/team) · ~ = game console · F1 = this log · fullscreen button bottom-right');
logLine('[vote] ~ console: callvote map q3dm17 · callvote nextmap · callvote g_gametype 3 … — others answer: /vote yes or /vote no');
logLine('[chat] y = say (chat) · tools sit bottom-right when the cursor is free');

function say(msg) { statusEl.textContent = msg; logLine(msg); }
function fail(msg) {
  errorBox.textContent = msg;
  console.error(msg);
  document.getElementById('bootNew').style.display = '';
  logBox.classList.add('show');
}

// ---------------------------------------------------------------- settings

const nameKey = 'q3.playerName';
const savedName = localStorage.getItem(nameKey) || '';
nameInput.value = params.get('name') || savedName || '';

// Character selector: every player model in retail pak0. Persisted like the
// name and applied with `+set model` before connecting.
const models = ['sarge', 'major', 'grunt', 'visor', 'hunter', 'razor', 'bitterman',
  'biker', 'mynx', 'slash', 'sorlag', 'klesk', 'lucy', 'tankjr', 'keel', 'orbb',
  'uriel', 'xaero', 'anarki', 'bones', 'crash', 'doom', 'ranger'];
const modelKey = 'q3.playerModel';
const modelInput = document.getElementById('model');
for (const m of models) {
  const opt = document.createElement('option');
  opt.value = m;
  opt.textContent = m.charAt(0).toUpperCase() + m.slice(1);
  modelInput.appendChild(opt);
}
const savedModel = localStorage.getItem(modelKey);
if (savedModel && models.includes(savedModel)) modelInput.value = savedModel;

// ------------------------------------------------------------- character preview
// Shows the retail "icon_default.tga" that ships for every player model in
// pak0. Rather than downloading the whole pak, the icon is pulled out with two
// small HTTP range requests (zip central directory, then the entry itself), so
// it works before the paks are cached. TGA files are decoded by hand — most
// Q3 icons are raw or RLE 24/32-bit images.

const previewCanvas = document.getElementById('modelPreview');
let pakIndex = null;          // filename -> {method, compSize, offset}
let pakIndexPromise = null;

const pakUrl = () => new URL('baseq3/pak0.pk3', new URL(dataBase, location.href)).href;

function range(url, start, end) {
  return fetch(url, { headers: { Range: `bytes=${start}-${end}` }, cache: 'no-store' })
    .then((r) => r.arrayBuffer());
}

async function loadPakIndex() {
  if (pakIndex) return pakIndex;
  if (pakIndexPromise) return pakIndexPromise;
  pakIndexPromise = (async () => {
    const url = pakUrl();
    const head = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    if (!head.ok) throw new Error(`pak0: HTTP ${head.status}`);
    const size = +head.headers.get('content-length') || 0;
    if (!size) throw new Error('pak0: unknown size');

    // find the end-of-central-directory record in the last 64 kB
    const tail = new Uint8Array(await range(url, Math.max(0, size - (1 << 16)), size - 1));
    const tv = new DataView(tail.buffer);
    let eocd = -1;
    for (let i = tv.byteLength - 22; i >= 0; i--) {
      if (tv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('pak0: zip EOCD not found');
    const cdOffset = tv.getUint32(eocd + 16, true);
    const cdSize = tv.getUint32(eocd + 12, true);

    // pull exactly the central directory and index it
    const cd = new Uint8Array(await range(url, cdOffset, cdOffset + cdSize - 1));
    const cv = new DataView(cd.buffer);
    const index = {};
    let p = 0;
    while (p + 46 <= cd.length && cv.getUint32(p, true) === 0x02014b50) {
      const method = cv.getUint16(p + 10, true);
      const compSize = cv.getUint32(p + 20, true);
      const lho = cv.getUint32(p + 42, true);
      const nameLen = cv.getUint16(p + 28, true);
      const extraLen = cv.getUint16(p + 30, true);
      const commentLen = cv.getUint16(p + 32, true);
      const name = new TextDecoder().decode(cd.subarray(p + 46, p + 46 + nameLen));
      index[name] = { method, compSize, lho };
      p += 46 + nameLen + extraLen + commentLen;
    }
    pakIndex = index;
    return index;
  })().catch((e) => { pakIndexPromise = null; throw e; });
  return pakIndexPromise;
}

async function gunzipRaw(buf) {
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function pakFile(path) {
  const index = await loadPakIndex();
  const entry = index[path];
  if (!entry) throw new Error(`pak0: no ${path}`);
  const url = pakUrl();
  // local header (30 bytes) to find where the raw data begins
  const lh = new DataView(await range(url, entry.lho, entry.lho + 29));
  if (lh.getUint32(0, true) !== 0x04034b50) throw new Error('pak0: bad local header');
  const dataStart = entry.lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
  const data = new Uint8Array(await range(url, dataStart, dataStart + entry.compSize - 1));
  return entry.method === 8 ? gunzipRaw(data) : data;
}

function drawTga(canvas, data) {
  const type = data[2];				// 2 = raw, 10 = RLE
  if (type !== 2 && type !== 10) return false;
  const view = new DataView(data.buffer, data.byteOffset);
  const w = view.getUint16(12, true), h = view.getUint16(14, true);
  const depth = data[16], desc = data[17];
  if ((depth !== 24 && depth !== 32) || w > 512 || h > 512) return false;
  const pp = depth / 8;
  const cmapLen = data[1] ? view.getUint16(5, true) * (data[7] / 8) : 0;
  let src = data.subarray(18 + data[0] + cmapLen);

  // type 10 = run-length encoded
  let pixels;
  if (type === 10) {
    pixels = new Uint8Array(w * h * pp);
    let o = 0, d = 0;
    while (o < src.length && d < pixels.length) {
      const packet = src[o++];
      const count = (packet & 0x7f) + 1;
      if (packet & 0x80) {
        for (let k = 0; k < count && d + pp <= pixels.length; k++, d += pp) {
          pixels.set(src.subarray(o, o + pp), d);
        }
        o += pp;
      } else {
        const run = count * pp;
        pixels.set(src.subarray(o, o + run), d);
        o += run; d += run;
      }
    }
  } else {
    pixels = src;
  }

  const image = new ImageData(w, h);
  // TGA pixels are BGR(A); descriptor bit 0x20 = top-down rows
  for (let y = 0; y < h; y++) {
    const srcY = (desc & 0x20) ? y : h - 1 - y;
    for (let x = 0; x < w; x++) {
      const i = (srcY * w + x) * pp;
      const o = (y * w + x) * 4;
      image.data[o] = pixels[i + 2];
      image.data[o + 1] = pixels[i + 1];
      image.data[o + 2] = pixels[i];
      image.data[o + 3] = pp === 4 ? pixels[i + 3] : 255;
    }
  }
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').putImageData(image, 0, 0);
  return true;
}

let previewFor = '';
async function updatePreview() {
  const model = modelInput.value || 'sarge';
  if (model === previewFor) return;
  previewFor = model;
  const canvas = previewCanvas;
  canvas.classList.remove('has');
  try {
    const data = await pakFile(`models/players/${model}/icon_default.tga`);
    if (previewFor !== model) return; // user switched away meanwhile
    if (drawTga(canvas, data)) canvas.classList.add('has');
  } catch (e) {
    console.error('preview:', e && e.message || e);
  }
}

modelInput.addEventListener('change', updatePreview);
updatePreview();

// WebSocket gateway URL. The Emscripten UDP socket layer talks to it with one
// binary frame per Quake 3 datagram.
const gatewayUrl = params.get('server') ||
  `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;

// Quake connect address (display + net stamping only; traffic flows over the ws
// gateway). Defaults to this host on the standard Q3 port.
const connectAddress = params.get('connect') || `${location.hostname}:27960`;

// Where PK3 files live (served by the same site under /assets/...).
const dataBase = params.get('data') || '/assets/';

// Game directory: baseq3 (retail paks, default) or demoq3 (free demo pack,
// via ?game=demoq3).
const gameId = (params.get('game') || 'baseq3').replace(/[^\w]/g, '') || 'baseq3';

// Asset list: retail pak0..pak8 (the official 1.32 point release carries the
// VMs in pak7/pak8) or the demo pack plus server maps.
const files = gameId === 'baseq3'
  ? Array.from({ length: 9 }, (_, i) => `baseq3/pak${i}.pk3`)
  : [`demoq3/pak0.pk3`,
     `demoq3/map_oxodm1.pk3`, `demoq3/map_oxodm6.pk3`, `demoq3/padcrash.pk3`];

function dirOf(rel) { return `/${rel.split('/')[0]}`; }
function baseOf(rel) { return rel.match(/[^/]+$/)[0]; }

playBtn.addEventListener('click', start);
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });

// ?name= in the URL auto-starts (shareable "join as X" links, and testing).
if (params.get('name')) start();

// ---------------------------------------------------------------- opfs cache
// Persistent per-origin file cache: PK3s are downloaded once and survive
// reloads and restarts. Metadata (etag per file) lives in a small JSON so a
// changed pak on the server re-downloads automatically.

async function getCacheRoot() {
  if (!navigator.storage?.getDirectory) return null;
  return navigator.storage.getDirectory().catch(() => null);
}

async function loadMeta(root) {
  try {
    const f = await (await root.getFileHandle('meta.json')).getFile();
    return JSON.parse(await f.text() || '{}');
  } catch {
    return {};
  }
}

async function saveMeta(root, meta) {
  try {
    const w = await (await root.getFileHandle('meta.json', { create: true })).createWritable();
    await w.write(JSON.stringify(meta));
    await w.close();
  } catch {
    // metadata is an optimization, not a requirement
  }
}

async function clearCache() {
  const root = await getCacheRoot();
  if (!root) { say('no persistent cache in this browser'); return; }
  for (const d of ['baseq3', 'demoq3']) {
    await root.removeEntry(d, { recursive: true }).catch(() => {});
  }
  await root.removeEntry('meta.json').catch(() => {});
  say('cached downloads cleared (will re-download next play)');
}

document.getElementById('clearCache').addEventListener('click', (e) => {
  e.preventDefault();
  clearCache();
});

// Make sure the browser does not evict ~500 MB of paks under pressure.
navigator.storage?.persist?.().then((ok) => {
  if (!ok) logLine('note: storage not marked persistent (browser may evict cache)');
});

// Download (or restore from OPFS) one asset. `progress` collects
// {received,total} entries so the bar reflects real byte counts.
async function acquire(root, meta, rel, progress) {
  const url = new URL(rel, new URL(dataBase, location.href));
  const entry = { rel, name: baseOf(rel), dir: dirOf(rel), received: 0, total: 0, fromCache: false, handle: null, buf: null };

  // freshness probe (a few hundred bytes) — also gives a size for the progress bar
  let etag = null;
  try {
    const head = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    if (head.ok) {
      etag = head.headers.get('etag');
      entry.total = +head.headers.get('content-length') || entry.total;
    }
  } catch { /* offline: fall through, cache is still usable */ }

  let opfsDir = null;
  if (root) {
    opfsDir = await root.getDirectoryHandle(rel.split('/')[0], { create: true }).catch(() => null);
  }

  const cached = meta[rel];
  if (opfsDir && cached) {
    try {
      const handle = await opfsDir.getFileHandle(entry.name);
      // a new etag means the pak changed on the server; otherwise trust the copy
      if (cached.etag === etag || (etag === null && (!entry.total || cached.size === entry.total))) {
        const size = (await handle.getFile()).size;
        entry.handle = handle;
        entry.received = entry.total = size;
        entry.fromCache = true;
        progress.push(entry);
        return entry;
      }
    } catch {
      // no cached copy after all
    }
  }

  const response = await fetch(url, { cache: 'default' });
  if (!response.ok) throw new Error(`${rel}: HTTP ${response.status}`);
  entry.total = +response.headers.get('content-length') || entry.total;

  let wrote = false;
  if (opfsDir && response.body && opfsDir.getFileHandle && opfsDir) {
    try {
      const handle = await opfsDir.getFileHandle(entry.name, { create: true });
      const writable = await handle.createWritable();
      const reader = response.body.getReader();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        await writable.write(value);
        entry.received += value.byteLength;
        updateBar(progress);
      }
      await writable.close();
      entry.handle = handle;
      meta[rel] = { etag, size: entry.received };
      wrote = true;
    } catch (e) {
      console.error(`cache write failed for ${rel}: ${e && e.message || e}`);
    }
  }

  if (!wrote) {
    const data = await response.arrayBuffer();
    entry.buf = data;
    entry.received = data.byteLength;
    if (!entry.total) entry.total = data.byteLength;
  }

  progress.push(entry);
  updateBar(progress);
  return entry;
}

function updateBar(progress) {
  let got = 0, all = 0;
  for (const p of progress) { got += p.received; all += p.total; }
  if (all) barEl.style.width = Math.min(100, (got / all) * 100) + '%';
}

function cacheDoneMb(progress) {
  let got = 0;
  for (const p of progress) got += p.received;
  return (got / 1048576).toFixed(0);
}

// ---------------------------------------------------------------- start flow

async function start() {
  const playerName = (nameInput.value.trim().replace(/[^\w\- ]/g, '').slice(0, 16)) || 'Player';
  localStorage.setItem(nameKey, playerName);
  const playerModel = modelInput.value || 'sarge';
  localStorage.setItem(modelKey, playerModel);
  playBtn.disabled = true;
  nameInput.disabled = true;
  modelInput.disabled = true;
  // keep the browser-side log overlay out of the way once the game takes over;
  // F1 or the "logs" button bring it back
  logBox.classList.remove('show');

  document.getElementById('login').style.display = 'none';
  document.getElementById('bootNew').style.display = '';

  try {
    await loadGame(playerName, playerModel);
  } catch (e) {
    fail(String(e && e.message || e));
  }
}

async function loadGame(playerName, playerModel) {
  say(`preparing ${gameId} data…`);
  barBox.style.display = 'block';

  const results = [];
  try {
    const root = await getCacheRoot();
    if (root) {
      const meta = await loadMeta(root);
      const progress = [];
      for (const rel of files) {
        try {
          const entry = await acquire(root, meta, rel, progress);
          results.push(entry);
          if (entry.fromCache) say(`${rel}: cached`);
          else if (entry.handle) say(`${rel}: downloaded ${cacheDoneMb(progress)} MB`);
        } catch (e) {
          console.error('skipping asset: ' + (e && e.message || e));
        }
      }
      await saveMeta(root, meta);
    }
  } catch (e) {
    console.error('persistent cache unavailable: ' + (e && e.message || e));
  }

  if (!results.length) {
    // last-ditch plain fetch, no cache
    for (const rel of files) {
      try {
        const response = await fetch(new URL(rel, new URL(dataBase, location.href)), { cache: 'force-cache' });
        if (!response.ok) throw new Error(`${rel}: HTTP ${response.status}`);
        const data = await response.arrayBuffer();
        results.push({ rel, name: baseOf(rel), dir: dirOf(rel), buf: data, handle: null, received: data.byteLength, total: data.byteLength });
        say(`got ${rel} (${(data.byteLength / 1048576).toFixed(0)} MB)`);
      } catch (e) {
        console.error('skipping asset: ' + (e && e.message || e));
      }
    }
  }
  if (!results.length) {
    throw new Error(`No PK3 files found under ${dataBase}${gameId}/ - game data missing`);
  }
  say(`assets ready (${cacheDoneMb(results)} MB)`);

  say('starting engine…');
  barEl.style.width = '100%';

  const ioquake3 = (await import('./ioquake3.js')).default;

  const canvas = document.getElementById('canvas');
  ioquake3({
    canvas,
    arguments: [
      '+set', 'net_enabled', '1',
      '+set', 'sv_pure', '0',
      '+set', 'com_basegame', gameId,
      '+set', 'name', playerName,
      '+set', 'model', playerModel,
      '+connect', connectAddress,
    ],
    locateFile: (file) => new URL(file, location.href).href,
    websocket: { url: gatewayUrl, subprotocol: 'binary' },
    onAbort: (reason) => fail('engine aborted: ' + reason),
    preRun: [async (module) => {
      module.addRunDependency('setup-fs');
      try {
        for (const f of results) {
          module.FS.mkdirTree(f.dir);
          if (f.buf !== null) {
            module.FS.writeFile(`${f.dir}/${f.name}`, new Uint8Array(f.buf));
            f.buf = null; // free the copy once mounted
          } else {
            const data = await f.handle.getFile();
            module.FS.writeFile(`${f.dir}/${f.name}`, new Uint8Array(await data.arrayBuffer()));
          }
          logLine(`mounted ${f.dir}/${f.name}`);
        }
      } finally {
        module.removeRunDependency('setup-fs');
      }
    }],
  });

  canvas.style.display = 'block';
  document.getElementById('bootNew').style.display = 'none';
  playbar.classList.add('show');
}
</script>
</body>
</html>
