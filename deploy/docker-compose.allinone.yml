# Single-container variant of docker-compose.yml: ioq3ded + gateway + Caddy
# in one image (Dockerfile.allinone).
#
#   RCON_PASSWORD=... DOMAIN=quake.example.com \
#     docker compose -f docker-compose.allinone.yml up -d --build
#
# Uses the same ports as the three-container stack — stop that one first
# (docker compose down), or override HTTP_PORT / HTTPS_PORT / GAME_UDP_PORT.
services:
  q3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.allinone
    image: q3-web-allinone:local
    environment:
      # Caddyfile site address; omit for localhost with an internal cert.
      DOMAIN: "${DOMAIN:-localhost}"
      FS_BASEGAME: "${FS_BASEGAME:-baseq3}"
      # server frames per second (ioquake3 default 20); higher = smoother, more CPU/bandwidth
      SV_FPS: "${SV_FPS:-30}"
      # Shared by ioq3ded (rcon) and the gateway admin API; must be set.
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD (admin panel / rcon password)}"
      # List this server on q3js.com (community servers). Needs a public
      # domain with real TLS — set Q3JS_PUBLISH_HOST to it (see README).
      Q3JS_MASTER_URL: "${Q3JS_MASTER_URL:-https://master.q3js.com}"
      Q3JS_PUBLISH_HOST: "${Q3JS_PUBLISH_HOST:-}"
      Q3JS_PUBLISH_PORT: "${Q3JS_PUBLISH_PORT:-443}"
      Q3JS_SECURE: "${Q3JS_SECURE:-true}"
      MAX_CONNECTIONS: "64"
      # opt-in edge caching for /assets/ paks (see Caddyfile); default no-cache
      PAK_CACHE_CONTROL: "${PAK_CACHE_CONTROL:-no-cache}"
    volumes:
      # Your legally obtained pak0.pk3..pak8.pk3 go in ./quake3-data/baseq3/
      # (writable: the server publishes zz-cgame.pk3 there for the browsers)
      - ./quake3-data:/data
      - server-state:/state
      - caddy-state:/caddy
    # Published on this machine only by default. On a public server set
    # BIND_IP=0.0.0.0 (or the host's public address) to accept players.
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:80/tcp"
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443/tcp"
      # Optional: native ioquake3 players. Browser clients come in over wss.
      - "${BIND_IP:-127.0.0.1}:${GAME_UDP_PORT:-27960}:27960/udp"
    restart: unless-stopped

volumes:
  server-state:
  caddy-state:
