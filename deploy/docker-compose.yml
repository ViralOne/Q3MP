services:
  q3ded:
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    image: q3-web-server:local
    volumes:
      # Your legally obtained pak0.pk3..pak8.pk3 go in ./quake3-data/baseq3/
      - ./quake3-data:/data:ro
      # Same directory, writable: the server publishes the client cgame pk3
      # (zz-cgame) that the web server then serves under /assets/.
      - ./quake3-data:/out
      - server-state:/state
    # Retail content by default; switch to demo with FS_BASEGAME: "demoq3".
    # VMs come from the official pak7/pak8 point-release QVMs.
    environment:
      FS_BASEGAME: "baseq3"
      # server frames per second (ioquake3 default 20)
      SV_FPS: "${SV_FPS:-30}"
      # Remote console password, used by the admin panel. Required: set
      # RCON_PASSWORD=... in the environment or deploy/.env (no default).
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD (admin panel / rcon password)}"
    healthcheck:
      # answers an out-of-band getstatus on its UDP port (bash /dev/udp)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/udp/127.0.0.1/27960 && printf '\\377\\377\\377\\377getstatus\\n' >&3 && timeout 3 head -c 18 <&3 | grep -q statusResponse"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    ports:
      # Optional: expose UDP so native ioquake3 players can join too.
      # The WASM clients come in through the gateway over wss.
      - "27960:27960/udp"
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway/Dockerfile
    image: q3-web-gateway:local
    environment:
      TARGET_HOST: q3ded
      TARGET_PORT: "27960"
      STATS_LOG: "/state/baseq3/games.log"
      # admin-chosen map lists per game mode (the server-state mount is read-only)
      PRESETS_FILE: "/gateway-state/presets.json"
      MAX_CONNECTIONS: "64"
      # Validated against incoming /admin/api requests; must match the server.
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD (admin panel / rcon password)}"
      # List this server on q3js.com (community servers). Needs a public
      # domain with real TLS — set Q3JS_PUBLISH_HOST to it (see README).
      Q3JS_MASTER_URL: "${Q3JS_MASTER_URL:-https://master.q3js.com}"
      Q3JS_PUBLISH_HOST: "${Q3JS_PUBLISH_HOST:-}"
      Q3JS_PUBLISH_PORT: "${Q3JS_PUBLISH_PORT:-443}"
      Q3JS_SECURE: "${Q3JS_SECURE:-true}"
    volumes:
      # Read-only access to the paks, to extract the list of loadable maps
      # for /admin.html (names only, straight from the zip directories).
      - ./quake3-data:/data:ro
      # the server's games.log, for the /stats leaderboard
      - server-state:/state:ro
      - gateway-state:/gateway-state
    healthcheck:
      # 200 only while the game server answers too
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      - q3ded
    restart: unless-stopped

  web:
    image: caddy:2
    environment:
      # Caddyfile site address; without it Caddy only serves localhost
      DOMAIN: "${DOMAIN:-localhost}"
      # opt-in edge caching for /assets/ paks (see Caddyfile); default no-cache
      PAK_CACHE_CONTROL: "${PAK_CACHE_CONTROL:-no-cache}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/web:ro
      - ./quake3-data:/srv/data:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy's admin API (loopback only inside the container)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      - gateway

volumes:
  server-state:
  gateway-state:
  caddy_data:
  caddy_config:
