// Quake III Arena dedicated server defaults (vanilla baseq3).
// Override wholesale via the Q3JS_SERVER_CONFIG environment variable.
// Player voting: anyone opens the ~ console and calls e.g.
//   callvote map q3dm17 · callvote nextmap · callvote g_gametype 3
// others answer with "/vote yes" / "/vote no". Admins turn this off with
// g_allowVote 0 (Flags card in /admin.html).
seta g_allowVote "1"

seta sv_hostname "Quake 3 Web Server"
seta sv_maxclients "16"
seta sv_allowDownload "1"
// write games.log lines immediately (the /stats leaderboard follows it)
seta g_logsync "1"
seta sv_pure "0"
seta g_gametype "0"
seta g_warmup "10"
seta fraglimit "20"
seta timelimit "15"
seta g_motd "Welcome - powered by ioquake3 on the web"
seta g_spSkill "3"

// Map rotation - edit freely. Must end with a map command.
seta g_gametype "0"
// ..::LvL community maps (oxodm1=de_dust2, oxodm6=de_aztec, padcrash,
// fff, lun3dm5 "You'll Shoot Your Eye Out", teddm1 "Deep Inside",
// q3gwdm1 "Achromatic").
set d1 "map q3dm6 ; set nextmap vstr d2"
set d2 "map oxodm1 ; set nextmap vstr d3"
set d3 "map padcrash ; set nextmap vstr d4"
set d4 "map q3dm7 ; set nextmap vstr d5"
set d5 "map oxodm6 ; set nextmap vstr d6"
set d6 "map q3dm17 ; set nextmap vstr d7"
set d7 "map fff ; set nextmap vstr d8"
set d8 "map q3dm9 ; set nextmap vstr d9"
set d9 "map teddm1 ; set nextmap vstr d10"
set d10 "map q3dm11 ; set nextmap vstr d11"
set d11 "map lun3dm5 ; set nextmap vstr d12"
set d12 "map q3dm13 ; set nextmap vstr d13"
set d13 "map q3gwdm1 ; set nextmap vstr d1"
vstr d1
