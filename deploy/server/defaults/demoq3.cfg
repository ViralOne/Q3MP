// Quake III demo-content server (free demo data, no retail files needed).
// Maps available: q3dm1, q3dm7, q3dm17, q3tourney2.
seta sv_hostname "Quake 3 Web Server (demo)"
seta sv_maxclients "16"
seta sv_allowDownload "1"
// write games.log lines immediately (the /stats leaderboard follows it)
seta g_logsync "1"
seta sv_pure "0"
seta g_gametype "0"
seta g_warmup "10"
seta fraglimit "20"
seta timelimit "15"
seta g_motd "Powered by ioquake3 on the web"

// Map rotation (demo maps + community maps from ..::LvL). Must end with a map command.
set d1 "map q3dm1 ; set nextmap vstr d2"
set d2 "map oxodm1 ; set nextmap vstr d3"
set d3 "map padcrash ; set nextmap vstr d4"
set d4 "map q3dm17 ; set nextmap vstr d5"
set d5 "map oxodm6 ; set nextmap vstr d6"
set d6 "map q3dm7 ; set nextmap vstr d7"
set d7 "map q3tourney2 ; set nextmap vstr d1"
vstr d1
