apiVersion: 1
contactPoints:
  - orgId: 1
    name: grafana-only
    receivers:
      - uid: grafana-only-local
        type: email
        settings:
          addresses: unused@localhost
        disableResolveMessage: true
policies:
  - orgId: 1
    receiver: grafana-only
    group_by: [grafana_folder, alertname]
    routes:
      - receiver: grafana-only
        object_matchers:
          - [observability, '=', master]
        mute_time_intervals: [grafana-only]
muteTimes:
  - orgId: 1
    name: grafana-only
    time_intervals:
      - times:
          - start_time: '00:00'
            end_time: '24:00'
