quarkus.application.name=q3js-master
quarkus.http.host=0.0.0.0
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.smallrye-health.management.enabled=false
quarkus.smallrye-openapi.management.enabled=false
quarkus.micrometer.binder.http-server.ignore-patterns=/q/.*
quarkus.micrometer.binder.http-server.match-patterns=/api/players/[^/]+/distribution=/api/players/{playerName}/distribution,/api/players/[^/]+=/api/players/{playerName},/api/admin/bans/[^/]+=/api/admin/bans/{ipAddress}
quarkus.datasource.metrics.enabled=true
quarkus.datasource.jdbc.metrics.enabled=true
quarkus.datasource.jdbc.telemetry=true
quarkus.scheduler.metrics.enabled=true
quarkus.scheduler.tracing.enabled=true
quarkus.log.metrics.enabled=true
quarkus.log.category."org.jooq.tools.LoggerListener".level=OFF
quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service".value=q3js-master
quarkus.log.console.json.additional-field."version".value=${quarkus.application.version}
quarkus.log.console.json.additional-field."environment".value=${Q3JS_ENVIRONMENT:local}
quarkus.otel.logs.enabled=true
quarkus.otel.logs.level=INFO
quarkus.otel.metrics.enabled=false
quarkus.otel.sdk.disabled=${Q3JS_TELEMETRY_DISABLED:true}
quarkus.otel.resource.attributes=deployment.environment.name=${Q3JS_ENVIRONMENT:local}
quarkus.otel.exporter.otlp.endpoint=${Q3JS_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=0.1
quarkus.otel.traces.suppress-non-application-uris=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${Q3JS_CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS,DELETE
quarkus.http.cors.headers=accept,authorization,content-type,origin

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${Q3JS_DB_USER:postgres}
quarkus.datasource.password=${Q3JS_DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${Q3JS_DB_URL:jdbc:postgresql://localhost:5432/postgres}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.validate-on-migrate=true

quarkus.smallrye-openapi.info-title=Q3JS Master API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Game server discovery and registration API for Q3JS.
quarkus.smallrye-openapi.operation-id-strategy=method
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.smallrye-openapi.auto-add-security=false
mp.openapi.extensions.smallrye.remove-unused-schemas.enable=true
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.display-request-duration=true
quarkus.swagger-ui.operations-sorter=method
quarkus.native.resources.includes=dbip-country-lite.mmdb

q3js.master.server-status-timeout=3s
q3js.master.refresh-every=5s
q3js.master.prune-every=10s
q3js.master.heartbeat-ttl=5m
q3js.master.event-client-secret=${Q3JS_EVENT_CLIENT_SECRET}
q3js.master.geoip.country-db-path=${Q3JS_COUNTRY_DB_PATH:/data/dbip-country-lite.mmdb}
q3js.master.geoip.country-db-resource=${Q3JS_COUNTRY_DB_RESOURCE:dbip-country-lite.mmdb}
q3js.master.voice.livekit-url=${Q3JS_LIVEKIT_URL:}
q3js.master.voice.api-key=${Q3JS_LIVEKIT_API_KEY:${LIVEKIT_API_KEY:}}
q3js.master.voice.api-secret=${Q3JS_LIVEKIT_API_SECRET:${LIVEKIT_API_SECRET:}}
q3js.master.voice.token-ttl=${Q3JS_LIVEKIT_TOKEN_TTL:6h}
q3js.master.auth.admin-password=${Q3JS_ADMIN_PASSWORD}
q3js.master.auth.token-ttl=${Q3JS_ADMIN_TOKEN_TTL:1h}
q3js.master.auth.issuer=q3js-master
q3js.master.auth.audience=q3js-admin

smallrye.jwt.sign.key.location=${Q3JS_ADMIN_JWT_PRIVATE_KEY_LOCATION:./privateKey.pem}
mp.jwt.verify.publickey.location=${Q3JS_ADMIN_JWT_PUBLIC_KEY_LOCATION:./publicKey.pem}
mp.jwt.verify.issuer=${q3js.master.auth.issuer}
mp.jwt.verify.audiences=${q3js.master.auth.audience}
smallrye.jwt.required.claims=sub,groups

# Unit tests do not migrate or health-check an external database.
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.datasource.health.enabled=false
%test.quarkus.scheduler.enabled=false
%dev.q3js.master.event-client-secret=${Q3JS_EVENT_CLIENT_SECRET:98e9b63a7b1bcd9103cdc951cda26976d06b6076df6ab13da1f20c25c7699167}
%test.q3js.master.event-client-secret=${Q3JS_EVENT_CLIENT_SECRET:98e9b63a7b1bcd9103cdc951cda26976d06b6076df6ab13da1f20c25c7699167}
%dev.q3js.master.geoip.fallback-country-code=${Q3JS_DEV_COUNTRY_CODE:RS}
%test.q3js.master.geoip.fallback-country-code=${Q3JS_DEV_COUNTRY_CODE:RS}
%dev.q3js.master.voice.livekit-url=${Q3JS_LIVEKIT_URL:https://staging.livekit.q3js.com}
%test.q3js.master.voice.livekit-url=https://staging.livekit.q3js.com
%test.q3js.master.voice.api-key=devkey
%test.q3js.master.voice.api-secret=devsecretdevsecretdevsecretdevsecret
%test.q3js.master.auth.admin-password=test-admin-password
%test.smallrye.jwt.sign.key.location=privateKey.pem
%test.mp.jwt.verify.publickey.location=publicKey.pem
